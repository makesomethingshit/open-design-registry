name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix-project-document-overview, feat/canvas-a-membership, feat/canvas-b-items]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to verify (defaults to the selected workflow ref)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_design_registry
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_design_registry
  BETTER_AUTH_SECRET: ci-test-secret-ci-test-secret-1234
  BETTER_AUTH_URL: http://127.0.0.1:3000
  S3_REGION: us-east-1
  S3_BUCKET: open-design-registry
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Classify changed files and validate docs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            echo "Non-PR event: full validation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --paginate --slurp \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$RUNNER_TEMP/pr-files.json"
          node scripts/ci-pr-check.mjs \
            --pages "$RUNNER_TEMP/pr-files.json" \
            --expected "$EXPECTED_FILES" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record requested and checked-out revision
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref }}
        run: |
          checked_out="$(git rev-parse HEAD)"
          echo "Requested ref: $REQUESTED_REF"
          echo "Checked-out SHA: $checked_out"
          {
            echo "### workflow_dispatch"
            echo "- Requested ref: $REQUESTED_REF"
            echo "- Checked-out SHA: $checked_out"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check Git history for committed credentials
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts="--all"

  pr-title:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::Changed-file classification failed; this required check cannot pass."
          exit 1
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          [[ "$PR_TITLE" =~ ^\[P[0-3]\]\[(bug|feature)\]\ .+\ \(\#[0-9]+\)$ ]] || {
            echo 'PR title must be [P{0-3}][bug|feature] Short summary (#issue)'
            exit 1
          }

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    env:
      RUN_PROPOSAL_CONCURRENCY_TEST: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_design_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d open_design_registry"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --run

  typecheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: http://127.0.0.1:9000
      E2E_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_design_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d open_design_registry"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start test object storage
        run: |
          docker run --detach --rm --name open-design-registry-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            docker.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data
          curl --retry 30 --retry-connrefused --retry-all-errors --retry-delay 1 --fail --silent --show-error \
            http://127.0.0.1:9000/minio/health/live
          npm run test:storage:prepare
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - name: Verify document image cleanup against PostgreSQL and MinIO
        run: npx vitest run scripts/document-image-cleanup.integration.test.mjs
        env:
          RUN_DOCUMENT_IMAGE_CLEANUP_TEST: "1"
      - name: Verify Canvas assets against PostgreSQL and MinIO
        run: npx vitest run src/lib/canvas/storage.integration.test.ts
        env:
          RUN_CANVAS_STORAGE_TEST: "1"
      - run: npm run test:e2e
      # Browser reports and traces can contain session tokens; keep them off public artifacts.
      - name: Upload browser screen evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-screenshots
          path: |
            test-results/**/mobile-*.png
            test-results/**/canvas-*.png
          retention-days: 7
