name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_design_registry
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_design_registry
  BETTER_AUTH_SECRET: ci-test-secret-ci-test-secret-1234
  BETTER_AUTH_URL: http://127.0.0.1:3000
  S3_REGION: us-east-1
  S3_BUCKET: open-design-registry
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUN_PROPOSAL_CONCURRENCY_TEST: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_design_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d open_design_registry"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --run

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: http://127.0.0.1:9000
      E2E_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_design_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d open_design_registry"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start test object storage
        run: |
          docker run --detach --rm --name open-design-registry-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            docker.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data
          curl --retry 30 --retry-connrefused --retry-all-errors --retry-delay 1 --fail --silent --show-error \
            http://127.0.0.1:9000/minio/health/live
          npm run test:storage:prepare
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
