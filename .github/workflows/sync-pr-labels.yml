name: Sync PR labels from linked issues

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  issues: read
  pull-requests: write

jobs:
  # This runs with write permissions even for public fork PRs. Keep the code
  # on the base workflow: never checkout/run PR code or interpolate PR text
  # into the shell. Title/body are data passed through environment variables.
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Copy issue type and area labels without removing existing PR labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          title = os.environ.get("PR_TITLE", "")
          body = re.sub(r"<!--.*?-->", "", os.environ.get("PR_BODY", ""), flags=re.S)
          body = re.sub(r"(?ms)^\x60{3}.*?^\x60{3}[^\n]*$", "", body)

          # Only explicit issue links in the same repository count.
          reference = re.compile(
              r"\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|related\s+to|refs?)"
              r"\s+(?:(?P<repo>[\w.-]+/[\w.-]+))?#(?P<number>\d+)\b",
              re.IGNORECASE,
          )
          linked = set()
          for match in reference.finditer(body):
              named_repo = match.group("repo")
              if not named_repo or named_repo.lower() == repo.lower():
                  linked.add(int(match.group("number")))

          # The repository's PR title convention ends with (#issue).
          if not linked:
              title_match = re.search(r"\(#(\d+)\)\s*$", title)
              if title_match:
                  linked.add(int(title_match.group(1)))

          if not linked:
              print("No linked issue found; leaving PR labels unchanged.")
              raise SystemExit(0)

          token = os.environ["GITHUB_TOKEN"]

          def github_api(path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/" + path,
                  data=data,
                  method="POST" if data is not None else "GET",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "User-Agent": "odr-pr-label-sync",
                      "X-GitHub-Api-Version": "2022-11-28",
                      **({"Content-Type": "application/json"} if data is not None else {}),
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          labels = set()
          for number in sorted(linked)[:20]:
              try:
                  issue = github_api("issues/" + str(number))
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print(f"Referenced issue #{number} not found; skipping.")
                      continue
                  raise
              if "pull_request" in issue:
                  print(f"#{number} refers to a PR, not an issue; skipping.")
                  continue
              for item in issue.get("labels", []):
                  name = item["name"]
                  if name in ("bug", "enhancement") or name.startswith("area:"):
                      labels.add(name)

          if labels:
              github_api("issues/" + str(pr_number) + "/labels", {"labels": sorted(labels)})
              print(f"PR #{pr_number}: added/kept {', '.join(sorted(labels))}")
          else:
              print("Linked issues have no type/area labels; leaving PR unchanged.")
          PY
