name: Feature request
description: Suggest a new capability or improvement.
title: "[P?][feature] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before submitting a new request.

        Describe the problem or desired outcome before focusing on implementation.

        This issue and its attachments may become public. Remove API keys,
        session tokens, personal data, and private URLs from text and evidence.
        Report vulnerabilities privately using [SECURITY.md](https://github.com/makesomethingshit/open-design-registry/blob/main/SECURITY.md).

        Replace P? in the title with one review level: P0, P1, P2, or P3.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Estimate the human review needed. P1 needs a decision before implementation; P2 needs review of the result; P3 has explicit acceptance criteria that automated checks can verify. See CONTRIBUTING.md. P0 is reserved for critical incidents.
      options:
        - P0 - Critical incident
        - P1 - Human decision before implementation
        - P2 - Human review of the result
        - P3 - Automated verification sufficient
      default: 2
    validations:
      required: true

  - type: textarea
    id: human-review
    attributes:
      label: Human review
      description: For P1, name the decision needed; for P2, what a person must inspect; for P3, the acceptance criteria and automated checks. This is an estimate; each PR is classified by its actual changes.
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem, limitation, or unmet need does this request address?
      placeholder: |
        I'm trying to ... but currently ...
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible or improve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: If you have an implementation or interaction idea, describe it here.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
      description: Add sanitized mockups, screenshots, or references. Remove credentials, personal data, and private URLs before attaching them.
    validations:
      required: false
