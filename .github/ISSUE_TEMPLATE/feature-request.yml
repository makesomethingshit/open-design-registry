name: Feature request
description: Suggest a new capability or improvement.
title: "[P?][feature] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before submitting a new request.

        Describe the problem or desired outcome before focusing on implementation.

        Replace P? in the title with one priority: P0, P1, P2, or P3.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the current priority of this issue.
      options:
        - P0 - Critical
        - P1 - High
        - P2 - Normal
        - P3 - Low
      default: 2
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem, limitation, or unmet need does this request address?
      placeholder: |
        I'm trying to ... but currently ...
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible or improve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: If you have an implementation or interaction idea, describe it here.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
      description: Add alternatives, mockups, screenshots, related issues, or references if useful.
    validations:
      required: false
