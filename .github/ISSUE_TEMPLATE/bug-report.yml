name: Bug report
description: Report behavior that appears incorrect or broken.
title: "[P?][bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Please search existing issues before submitting a new report.

        This issue and its attachments may become public. Remove API keys,
        session tokens, personal data, and private URLs from text and evidence.
        Report vulnerabilities privately using [SECURITY.md](https://github.com/makesomethingshit/open-design-registry/blob/main/SECURITY.md).

        Replace P? in the title with one review level: P0, P1, P2, or P3.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Estimate the human review needed. P1 needs a decision before implementation; P2 needs review of the result; P3 has explicit acceptance criteria that automated checks can verify. See CONTRIBUTING.md. P0 is reserved for critical incidents.
      options:
        - P0 - Critical incident
        - P1 - Human decision before implementation
        - P2 - Human review of the result
        - P3 - Automated verification sufficient
      default: 2
    validations:
      required: true

  - type: textarea
    id: human-review
    attributes:
      label: Human review
      description: For P1, name the decision needed; for P2, what a person must inspect; for P3, the acceptance criteria and automated checks. This is an estimate; each PR is classified by its actual changes.
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the smallest sequence that reproduces the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or recordings
      description: Add sanitized screenshots, recordings, or logs. Remove credentials, cookies, personal data, and private URLs before attaching them.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add environment details, related issues, or anything else that may help.
    validations:
      required: false
