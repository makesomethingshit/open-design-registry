name: Bug report
description: Report behavior that appears incorrect or broken.
title: "[P?][bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Please search existing issues before submitting a new report.

        Replace P? in the title with one priority: P0, P1, P2, or P3.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the current priority of this issue.
      options:
        - P0 - Critical
        - P1 - High
        - P2 - Normal
        - P3 - Low
      default: 2
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the smallest sequence that reproduces the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or recordings
      description: Add screenshots, recordings, logs, or other evidence if useful.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add environment details, related issues, or anything else that may help.
    validations:
      required: false
